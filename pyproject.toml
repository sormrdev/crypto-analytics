[project]
name = "crypto-analytics"
version = "0.2.0"
description = "Kraken spot market data pipeline (OHLC + trade-level backfill) into PostgreSQL, feeding a Power BI futures-position simulator."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0.30",
    "typer>=0.12",
]

[project.scripts]
crypto = "crypto_analytics.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crypto_analytics"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["_legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
